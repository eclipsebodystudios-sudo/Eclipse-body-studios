<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
</head>
<body>
    <h1>Booking Form</h1>
    <form>
        <label for="package">Select Your Package:</label>
        <select id="package" name="package" required>
            <option value="basic">Basic Package</option>
            <option value="premium">Premium Package</option>
            <option value="vip">VIP Package</option>
        </select>
        <br>
        <label for="goals">Goals/Preferences:</label>
        <textarea id="goals" name="goals" rows="4" cols="50" placeholder="Enter your goals/preferences here..." required></textarea>
        <br>
        <input type="submit" value="Submit">
    </form>
    <p>Contact will be made separately to arrange specific training dates.</p>
</body>
</html>
